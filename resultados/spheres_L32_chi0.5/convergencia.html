<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convergência LBM</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --border: #e3e2dd;
  --grid: #ecebe7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --series-1: #2a78d6;
  --band: rgba(27, 175, 122, 0.16);
  --band-edge: #1baf7a;
  --good: #008300;
  --warning: #b87900;
  --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #2e2d2b;
    --grid: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --band: rgba(25, 158, 112, 0.22);
    --band-edge: #199e70;
    --good: #3fae3f;
    --warning: #d9a03a;
    --critical: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #2e2d2b;
  --grid: #262624;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --series-1: #3987e5;
  --band: rgba(25, 158, 112, 0.22);
  --band-edge: #199e70;
  --good: #3fae3f;
  --warning: #d9a03a;
  --critical: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.sub { color: var(--text-secondary); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; padding: 2px 10px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface-1); }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.status.run { color: var(--series-1); }
.status.ok { color: var(--good); }
.status.stop { color: var(--warning); }
.status.bad { color: var(--critical); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.tile .lab { color: var(--text-secondary); font-size: 12px; }
.tile .val { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .det { color: var(--text-muted); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 4px 0 12px; color: var(--text-secondary); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-1); color: var(--text-secondary); padding: 5px 12px; cursor: pointer; font: inherit; }
.seg button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 8px; position: relative; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 14px; margin: 0; font-weight: 600; }
.card .note { color: var(--text-muted); font-size: 12px; min-height: 17px; }
svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
.axis text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--border); stroke-width: 1; }
.line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.tol { stroke: var(--text-secondary); stroke-width: 1.5; stroke-dasharray: 6 4; }
.extrap { fill: none; stroke: var(--series-1); stroke-width: 1.5; stroke-dasharray: 2 4; opacity: .8; }
.band { fill: var(--band); }
.bandedge { stroke: var(--band-edge); stroke-width: 1; stroke-dasharray: 3 3; }
.dlabel { fill: var(--text-secondary); font-size: 11px; }
.cross { stroke: var(--text-muted); stroke-width: 1; }
.hoverdot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 5; }
.tip strong { font-variant-numeric: tabular-nums; }
.tip .k { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 6px; }
details { margin-top: 14px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; }
summary { cursor: pointer; color: var(--text-secondary); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12px; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 600; }
.tablewrap { overflow-x: auto; }
footer { color: var(--text-muted); font-size: 12px; margin-top: 14px; }
.empty { padding: 40px; text-align: center; color: var(--text-secondary); }
</style>
</head>

    el("span", { text: "  " + o.name }, l1);
    el("div", { class: "sub", text: "iteração " + fmtInt(x[i]) }, tip);
    tip.style.display = "block";
    const cr = card.getBoundingClientRect(), cw = card.clientWidth;
    const left = r.left - cr.left + px * r.width / W, topPx = r.top - cr.top + py * r.height / H;
    tip.style.left = Math.min(Math.max(4, left + 12), cw - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max(4, topPx - tip.offsetHeight - 10) + "px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", e => show(e.clientX));
  hit.addEventListener("pointerdown", e => show(e.clientX));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("blur", hide);
  hit.addEventListener("focus", () => { const r = svg.getBoundingClientRect(); show(r.right - 1); });
}

let STATE = { meta: {}, cols: null };
let zoom = store.get("zoom", "terco");

function tile(parent, lab, val, det) {
  const t = el("div", { class: "tile" }, parent);
  el("div", { class: "lab", text: lab }, t);
  el("div", { class: "val", text: val }, t);
  el("div", { class: "det", text: det || "" }, t);
}

function render() {
  const { meta, cols: c } = STATE;
  const charts = document.getElementById("charts"), tiles = document.getElementById("tiles");
  charts.replaceChildren(); tiles.replaceChildren();
  document.getElementById("titulo").textContent = "Convergência — " + (meta.caso || "LBM");
  if (!c) {
    el("div", { class: "card wide empty", text: "Aguardando o primeiro relatório (100 iterações)…" }, charts);
    return;
  }
  const d = diagnose(meta, c), N = c.it.length;
  const st = { run: "Rodando", ok: "Convergido", stop: "Parada ou pausada", bad: "Divergiu (NaN)" }[d.state];
  const sEl = document.getElementById("status");
  sEl.className = "status " + d.state;
  document.getElementById("statusTxt").textContent = st;
  document.getElementById("subtitulo").textContent =
    `modelo ${meta.modelo || "?"} · pasta ${EMBED.pasta} · última leitura há ${fmtT(d.age)}`;
  document.title = `${d.state === "ok" ? "✓" : d.state === "run" ? "▶" : "■"} ${meta.caso || ""} it ${d.it} — res ${fmtE(d.res)}`;

  tile(tiles, "Iteração", fmtInt(d.it), meta.max_iter ? "máx. " + fmtInt(Number(meta.max_iter)) : "");
  tile(tiles, "Resíduo", fmtE(d.res), d.steady ? "tolerância " + d.tol.toExponential(0) : "caso transiente");
  tile(tiles, "Taxa de convergência", Number.isFinite(d.rate) ? d.rate.toFixed(3) : "—", "décadas / 1000 it (últimas 20 leituras)");
  tile(tiles, "Velocidade", Number.isFinite(d.its) ? d.its.toFixed(2) + " it/s" : "—",
       N ? (c.mlups[N - 1]).toFixed(2) + " MLUPS" : "");
  if (d.steady) tile(tiles, "Tempo restante (estim.)",
       d.state === "ok" ? "0" : fmtT(d.etaS),
       d.state === "ok" ? "tolerância atingida" : Number.isFinite(d.etaIt) ? "~" + fmtInt(d.etaIt) + " it" : "resíduo não está caindo");

  const card = el("div", { class: "card wide" }, charts);
  el("h2", { text: "Resíduo ‖uⁿ − uⁿ⁻¹⁰⁰‖₂ / ‖uⁿ‖₂" }, card);
  el("div", { class: "note", text: d.fit ? "linha pontilhada: extrapolação log-linear até a tolerância" : "" }, card);
  chart(card, c.it, c.res, {
    log: true, name: "resíduo", fmt: fmtE, height: 260, tol: d.steady ? d.tol : null, rightLabel: "resíduo",
    extraY: d.steady ? [d.tol] : [], fit: d.fit, xmax: d.fit ? Math.min(c.it[N - 1] + d.etaIt, c.it[N - 1] * 3) : 0,
    aria: "Resíduo de convergência em escala log versus iteração"
  });

  const R = refs(meta);
  const extras = Object.keys(c).filter(k => !["it", "res", "tempo_unix", "mlups"].includes(k));
  const start = zoom === "terco" ? Math.max(0, Math.min(N - 5, Math.floor(N * 2 / 3))) : 0;
  for (const k of extras) {
    const v = c[k], cd = el("div", { class: "card" }, charts);
    const last = v[N - 1], prev = N > 5 ? v[N - 6] : NaN;
    const rel = Math.abs(last - prev) / Math.max(Math.abs(last), 1e-300);
    el("h2", { text: `${k} = ${fmtG(last)}` }, cd);
    let note = Number.isFinite(rel) ? `variação relativa em 500 it: ${rel.toExponential(1)}` : "";
    if (R[k]) {
      const [lo, hi] = R[k];
      note += hi > lo ? ` · referência [${fmtG(lo)}, ${fmtG(hi)}]` : ` · referência ${fmtG(lo)} (erro ${(100 * (last - lo) / lo).toFixed(2)}%)`;
    }
    el("div", { class: "note", text: note }, cd);
    chart(cd, c.it.slice(start), v.slice(start), {
      name: k, fmt: fmtG, band: R[k], extraY: zoom === "tudo" && R[k] ? R[k] : [],
      aria: `${k} versus iteração`
    });
  }

  const tb = document.getElementById("tabela");
  tb.replaceChildren();
  const cols = ["it", "res", ...extras, "mlups"];
  const hr = el("tr", {}, el("thead", {}, tb));
  for (const k of cols) el("th", { text: k }, hr);
  const body = el("tbody", {}, tb);
  for (let i = N - 1; i >= Math.max(0, N - 30); i--) {
    const tr = el("tr", {}, body);
    for (const k of cols) el("td", { text: k === "it" ? fmtInt(c[k][i]) : k === "res" ? fmtE(c[k][i]) : fmtG(c[k][i]) }, tr);
  }
  document.getElementById("rodape").textContent =
    `Gerado por lbm3d.py · ${N} leituras (uma a cada 100 iterações) · página atualizada às ${new Date().toLocaleTimeString("pt-BR")}`;
}

function setData(text) { STATE = parseCSV(text); render(); }

// atualizacao: servido por http -> busca o CSV; aberto do disco -> recarrega a pagina
const intervalo = Number(EMBED.intervalo) || 5;
document.getElementById("intv").textContent = intervalo;
const viaHttp = location.protocol.startsWith("http");
document.getElementById("modo").textContent = viaHttp ? "· modo servidor (dados ao vivo)" : "· arquivo local (recarrega a página)";
const auto = document.getElementById("auto");
auto.checked = store.get("auto", "1") === "1";
auto.addEventListener("change", () => { store.set("auto", auto.checked ? "1" : "0"); agenda(); });
let timer = null;
function agenda() {
  clearTimeout(timer);
  if (!auto.checked) return;
  timer = setTimeout(async () => {
    if (viaHttp) {
      try { const r = await fetch("convergencia.csv?t=" + Date.now(), { cache: "no-store" }); if (r.ok) setData(await r.text()); }
      catch (e) {}
      agenda();
    } else location.reload();
  }, intervalo * 1000);
}
for (const b of document.querySelectorAll(".seg button")) {
  b.setAttribute("aria-pressed", b.dataset.zoom === zoom ? "true" : "false");
  b.addEventListener("click", () => {
    zoom = b.dataset.zoom; store.set("zoom", zoom);
    for (const o of document.querySelectorAll(".seg button")) o.setAttribute("aria-pressed", o === b ? "true" : "false");
    render();
  });
}
let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
setData(EMBED.csv);
agenda();
</script>
</body>
