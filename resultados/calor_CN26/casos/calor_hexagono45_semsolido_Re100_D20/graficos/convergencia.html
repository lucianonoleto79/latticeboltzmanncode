  const it = c.it, res = c.res, t = c.tempo_unix, N = it.length;
  const tol = Number(meta.tol || 1e-7), steady = meta.steady !== "0";
  const out = { it: it[N - 1], res: res[N - 1], tol, steady, rate: NaN, its: NaN, etaIt: NaN, etaS: NaN, fit: null };
  const n = Math.min(20, N);
  if (n >= 3) {
    const xs = [], ys = [];
    for (let i = N - n; i < N; i++) if (res[i] > 0) { xs.push(it[i]); ys.push(Math.log10(res[i])); }
    if (xs.length >= 3) {
      const [a, b] = polyfit1(xs, ys);
      out.rate = -a * 1000;
      const dt = t[N - 1] - t[N - n];
      if (dt > 0) out.its = (it[N - 1] - it[N - n]) / dt;
      if (steady && a < 0 && out.res > tol) {
        out.etaIt = (Math.log10(tol) - Math.log10(out.res)) / a;
        out.etaS = out.its > 0 ? out.etaIt / out.its : NaN;
        out.fit = [a, b];
      }
    }
  }
  const age = Date.now() / 1000 - t[N - 1];
  const limite = Math.max(120, out.its > 0 ? 5 * 100 / out.its : 120);
  out.age = age;
  out.state = !Number.isFinite(out.res) ? "bad" : (steady && out.res <= tol) ? "ok" : (age < limite ? "run" : "stop");
  return out;
}

const fmtT = s => {
  if (!Number.isFinite(s)) return "—";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : m ? `${m} min ${String(ss).padStart(2, "0")} s` : `${ss} s`;
};
const fmtE = v => Number.isFinite(v) ? v.toExponential(2).replace("e", "e") : "—";
const fmtG = v => {
  if (!Number.isFinite(v)) return "—";
  const a = Math.abs(v);
  return (a !== 0 && (a < 1e-3 || a >= 1e5)) ? v.toExponential(3) : Number(v.toPrecision(6)).toString();
};
const fmtInt = v => Number.isFinite(v) ? Math.round(v).toLocaleString("pt-BR") : "—";

function el(tag, attrs = {}, parent) {
  const ns = ["svg", "g", "line", "path", "rect", "text", "circle"].includes(tag) ? "http://www.w3.org/2000/svg" : null;
  const e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (const k in attrs) {
    if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}

function niceTicks(lo, hi, n) {
  if (!(hi > lo)) { const d = Math.abs(lo) * 0.01 || 1; lo -= d; hi += d; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= step0);
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(+v.toPrecision(12));
  return ticks;
}

function chart(card, x, y, o) {
  // viewBox na largura real do cartao: texto sempre em pixels reais
  const W = Math.max(280, card.clientWidth - 28), H = o.height || 220;
  const m = { l: 62, r: (o.rightLabel || o.band || o.tol) ? 78 : 16, t: 10, b: 28 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.aria }, card);
  const tip = el("div", { class: "tip" }, card);
  const xi = x[0], xa = Math.max(x[x.length - 1], o.xmax || 0, xi + 1);
  let ys = y.filter(Number.isFinite);
  if (o.log) ys = ys.filter(v => v > 0);
  if (!ys.length) return;
  let ylo = Math.min(...ys), yhi = Math.max(...ys);
  for (const v of (o.extraY || [])) if (Number.isFinite(v) && (!o.log || v > 0)) { ylo = Math.min(ylo, v); yhi = Math.max(yhi, v); }
  let ty, Y;
  if (o.log) {
    const a = Math.floor(Math.log10(ylo)), b = Math.ceil(Math.log10(yhi) + 1e-9);
    const lo = a === b ? a - 1 : a, hi = b;
    Y = v => m.t + (H - m.t - m.b) * (hi - Math.log10(v)) / (hi - lo);
    ty = []; const st = Math.max(1, Math.ceil((hi - lo) / 6)); for (let k = lo; k <= hi; k += st) ty.push(Math.pow(10, k));
  } else {
    const pad = (yhi - ylo) * 0.08 || Math.abs(yhi) * 0.01 || 1;
    ty = niceTicks(ylo - pad, yhi + pad, 5);
    const lo = Math.min(ty[0], ylo - pad), hi = Math.max(ty[ty.length - 1], yhi + pad);
    Y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  }
  const X = v => m.l + (W - m.l - m.r) * (v - xi) / (xa - xi);
  const ax = el("g", { class: "axis" }, svg);
  for (const v of ty) {
    const yy = Y(v);
    el("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: yy, y2: yy }, ax);
    el("text", { x: m.l - 8, y: yy + 4, "text-anchor": "end", text: o.log ? "1e" + Math.round(Math.log10(v)) : fmtG(v) }, ax);
  }
  for (const v of niceTicks(xi, xa, 6)) {
    if (v < xi || v > xa) continue;
    el("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmtInt(v) }, ax);
  }
  el("line", { class: "baseline", x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }, ax);
  const top = m.t, bot = H - m.b, inside = yy => yy >= top - 0.5 && yy <= bot + 0.5;
  if (o.band) {
    const [lo, hi] = o.band, y1 = Math.max(top, Y(hi)), y2 = Math.min(bot, Y(lo));
    if (hi > lo && y2 > y1) el("rect", { class: "band", x: m.l, width: W - m.l - m.r, y: y1, height: y2 - y1 }, svg);
    for (const v of (hi > lo ? [lo, hi] : [lo])) if (inside(Y(v)))
      el("line", { class: "bandedge", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }, svg);
    const ym = Y((lo + hi) / 2);
    const lab = hi > lo ? "referência" : "ref. " + fmtG(lo);
    if (inside(ym)) el("text", { class: "dlabel", x: W - m.r + 6, y: ym + 4, text: lab }, svg);
    else el("text", { class: "dlabel", x: W - m.r + 6, y: ym < top ? top + 10 : bot - 4, text: lab + (ym < top ? " ↑" : " ↓") }, svg);
  }
  if (o.tol) {
    el("line", { class: "tol", x1: m.l, x2: W - m.r, y1: Y(o.tol), y2: Y(o.tol) }, svg);
    el("text", { class: "dlabel", x: W - m.r + 6, y: Y(o.tol) + 4, text: "tol " + o.tol.toExponential(0) }, svg);
  }
  if (o.fit) {
    const [a, b] = o.fit, x0 = x[x.length - 1], x1 = Math.min(xa, (Math.log10(o.tol) - b) / a);
    el("path", { class: "extrap", d: `M${X(x0)},${Y(Math.pow(10, a * x0 + b))}L${X(x1)},${Y(Math.pow(10, a * x1 + b))}` }, svg);
  }
  let d = "", pen = false;
  for (let i = 0; i < x.length; i++) {
    const v = y[i];
    if (!Number.isFinite(v) || (o.log && v <= 0)) { pen = false; continue; }
    d += (pen ? "L" : "M") + X(x[i]).toFixed(1) + "," + Y(v).toFixed(1); pen = true;
  }
  el("path", { class: "line", d }, svg);
  if (o.rightLabel) {
    const k = y.length - 1;
    if (Number.isFinite(y[k])) el("text", { class: "dlabel", x: X(x[k]) + 6, y: Y(y[k]) - 6, text: o.rightLabel }, svg);
  }
  // camada de hover: linha vertical + ponto + tooltip
  const cross = el("line", { class: "cross", y1: m.t, y2: H - m.b, visibility: "hidden" }, svg);
  const dot = el("circle", { class: "hoverdot", r: 4.5, visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent", tabindex: 0 }, svg);
  const show = clientX => {
    const r = svg.getBoundingClientRect(), sx = (clientX - r.left) * W / r.width;
    const xv = xi + (sx - m.l) / (W - m.l - m.r) * (xa - xi);
    let lo = 0, hi = x.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (x[mid] < xv) lo = mid; else hi = mid; }
    const i = Math.abs(x[lo] - xv) < Math.abs(x[hi] - xv) ? lo : hi;
    if (!Number.isFinite(y[i]) || (o.log && y[i] <= 0)) return;
    const px = X(x[i]), py = Y(y[i]);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tip.replaceChildren();
    const l1 = el("div", {}, tip); el("span", { class: "k" }, l1); el("strong", { text: o.fmt(y[i]) }, l1);
    el("span", { text: "  " + o.name }, l1);
    el("div", { class: "sub", text: "iteração " + fmtInt(x[i]) }, tip);
    tip.style.display = "block";
    const cr = card.getBoundingClientRect(), cw = card.clientWidth;
    const left = r.left - cr.left + px * r.width / W, topPx = r.top - cr.top + py * r.height / H;
    tip.style.left = Math.min(Math.max(4, left + 12), cw - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max(4, topPx - tip.offsetHeight - 10) + "px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", e => show(e.clientX));
  hit.addEventListener("pointerdown", e => show(e.clientX));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("blur", hide);
  hit.addEventListener("focus", () => { const r = svg.getBoundingClientRect(); show(r.right - 1); });
}

let STATE = { meta: {}, cols: null };
let zoom = store.get("zoom", "terco");

function tile(parent, lab, val, det) {
  const t = el("div", { class: "tile" }, parent);
  el("div", { class: "lab", text: lab }, t);
  el("div", { class: "val", text: val }, t);
  el("div", { class: "det", text: det || "" }, t);
}

function render() {
  const { meta, cols: c } = STATE;
  const charts = document.getElementById("charts"), tiles = document.getElementById("tiles");
  charts.replaceChildren(); tiles.replaceChildren();
  document.getElementById("titulo").textContent = "Convergência — " + (meta.caso || "LBM");
  if (!c) {
    el("div", { class: "card wide empty", text: "Aguardando o primeiro relatório (100 iterações)…" }, charts);
    return;
  }
  const d = diagnose(meta, c), N = c.it.length;
  const st = { run: "Rodando", ok: "Convergido", stop: "Parada ou pausada", bad: "Divergiu (NaN)" }[d.state];
  const sEl = document.getElementById("status");
  sEl.className = "status " + d.state;
  document.getElementById("statusTxt").textContent = st;
  document.getElementById("subtitulo").textContent =
    `modelo ${meta.modelo || "?"} · pasta ${EMBED.pasta} · última leitura há ${fmtT(d.age)}`;
  document.title = `${d.state === "ok" ? "✓" : d.state === "run" ? "▶" : "■"} ${meta.caso || ""} it ${d.it} — res ${fmtE(d.res)}`;

  tile(tiles, "Iteração", fmtInt(d.it), meta.max_iter ? "máx. " + fmtInt(Number(meta.max_iter)) : "");
  tile(tiles, "Resíduo", fmtE(d.res), d.steady ? "tolerância " + d.tol.toExponential(0) : "caso transiente");
  tile(tiles, "Taxa de convergência", Number.isFinite(d.rate) ? d.rate.toFixed(3) : "—", "décadas / 1000 it (últimas 20 leituras)");
  tile(tiles, "Velocidade", Number.isFinite(d.its) ? d.its.toFixed(2) + " it/s" : "—",
       N ? (c.mlups[N - 1]).toFixed(2) + " MLUPS" : "");
  if (d.steady) tile(tiles, "Tempo restante (estim.)",
       d.state === "ok" ? "0" : fmtT(d.etaS),
       d.state === "ok" ? "tolerância atingida" : Number.isFinite(d.etaIt) ? "~" + fmtInt(d.etaIt) + " it" : "resíduo não está caindo");

  const card = el("div", { class: "card wide" }, charts);
  el("h2", { text: "Resíduo ‖uⁿ − uⁿ⁻¹⁰⁰‖₂ / ‖uⁿ‖₂" }, card);
  el("div", { class: "note", text: d.fit ? "linha pontilhada: extrapolação log-linear até a tolerância" : "" }, card);
  chart(card, c.it, c.res, {
    log: true, name: "resíduo", fmt: fmtE, height: 260, tol: d.steady ? d.tol : null, rightLabel: "resíduo",
    extraY: d.steady ? [d.tol] : [], fit: d.fit, xmax: d.fit ? Math.min(c.it[N - 1] + d.etaIt, c.it[N - 1] * 3) : 0,
    aria: "Resíduo de convergência em escala log versus iteração"
  });

  const R = refs(meta);
  const extras = Object.keys(c).filter(k => !["it", "res", "tempo_unix", "mlups"].includes(k) && !k.startsWith("res_"));
  const resComp = Object.keys(c).filter(k => k.startsWith("res_"));
  const start = zoom === "terco" ? Math.max(0, Math.min(N - 5, Math.floor(N * 2 / 3))) : 0;
  for (const k of extras) {
    const v = c[k], cd = el("div", { class: "card" }, charts);
    const last = v[N - 1], prev = N > 5 ? v[N - 6] : NaN;
    const rel = Math.abs(last - prev) / Math.max(Math.abs(last), 1e-300);
    el("h2", { text: `${k} = ${fmtG(last)}` }, cd);
    let note = Number.isFinite(rel) ? `variação relativa em 500 it: ${rel.toExponential(1)}` : "";
    if (R[k]) {
      const [lo, hi] = R[k];
      note += hi > lo ? ` · referência [${fmtG(lo)}, ${fmtG(hi)}]` : ` · referência ${fmtG(lo)} (erro ${(100 * (last - lo) / lo).toFixed(2)}%)`;
    }
    el("div", { class: "note", text: note }, cd);
    chart(cd, c.it.slice(start), v.slice(start), {
      name: k, fmt: fmtG, band: R[k], extraY: zoom === "tudo" && R[k] ? R[k] : [],
      aria: `${k} versus iteração`
    });
  }

  const tb = document.getElementById("tabela");
  tb.replaceChildren();
  const cols = ["it", "res", ...resComp, ...extras, "mlups"];
  const hr = el("tr", {}, el("thead", {}, tb));
  for (const k of cols) el("th", { text: k }, hr);
  const body = el("tbody", {}, tb);
  for (let i = N - 1; i >= Math.max(0, N - 30); i--) {
    const tr = el("tr", {}, body);
    for (const k of cols) el("td", { text: k === "it" ? fmtInt(c[k][i]) : k.startsWith("res") ? fmtE(c[k][i]) : fmtG(c[k][i]) }, tr);
  }
  document.getElementById("rodape").textContent =
    `Gerado por lbm3d.py · ${N} leituras (uma a cada 100 iterações) · página atualizada às ${new Date().toLocaleTimeString("pt-BR")}`;
}

function setData(text) { STATE = parseCSV(text); render(); }

// atualizacao: servido por http -> busca o CSV; aberto do disco -> recarrega a pagina
const intervalo = Number(EMBED.intervalo) || 5;
document.getElementById("intv").textContent = intervalo;
const viaHttp = location.protocol.startsWith("http");
document.getElementById("modo").textContent = viaHttp ? "· modo servidor (dados ao vivo)" : "· arquivo local (recarrega a página)";
const auto = document.getElementById("auto");
auto.checked = store.get("auto", "1") === "1";
auto.addEventListener("change", () => { store.set("auto", auto.checked ? "1" : "0"); agenda(); });
let timer = null;
function agenda() {
  clearTimeout(timer);
  if (!auto.checked) return;
  timer = setTimeout(async () => {
    if (viaHttp) {
      try { const r = await fetch("convergencia.csv?t=" + Date.now(), { cache: "no-store" }); if (r.ok) setData(await r.text()); }
      catch (e) {}
      agenda();
    } else location.reload();
  }, intervalo * 1000);
}
for (const b of document.querySelectorAll(".seg button")) {
  b.setAttribute("aria-pressed", b.dataset.zoom === zoom ? "true" : "false");
  b.addEventListener("click", () => {
    zoom = b.dataset.zoom; store.set("zoom", zoom);
    for (const o of document.querySelectorAll(".seg button")) o.setAttribute("aria-pressed", o === b ? "true" : "false");
    render();
  });
}
let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
// contador do tempo de simulacao (andamento.json gravado pelo lbm3d.py a cada segundo)
let ANDAMENTO = EMBED.andamento || null;
function hms(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h + "h" + String(m).padStart(2, "0") + "m" + String(x).padStart(2, "0") + "s"; }
function contadorTick() {
  const a = ANDAMENTO, el = document.getElementById("contadorTxt"), box = document.getElementById("contador");
  if (!a) { el.textContent = "—"; return; }
  const agora = Date.now() / 1000, atraso = agora - a.atualizado_unix;
  const vivo = a.situacao === "rodando" && atraso < 120;
  const total = a.decorrido_total_s + (vivo ? atraso : 0);
  let t = hms(total) + " · it " + a.it;
  if (a.it_por_s) t += " · " + a.it_por_s.toFixed(1) + " it/s";
  if (a.progresso != null) t += " · " + Math.round(100 * a.progresso) + "%";
  if (a.restante_s != null && vivo) t += " · restante ~" + hms(a.restante_s - atraso);
  if (!vivo) t += " · " + (a.situacao === "rodando" ? "sem atualização" : a.situacao);
  el.textContent = t;
  box.className = "status " + (vivo ? "run" : a.situacao === "terminou" ? "ok" : "stop");
}
async function buscaAndamento() {
  if (!viaHttp) return;
  try { const r = await fetch("andamento.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) ANDAMENTO = await r.json(); }
  catch (e) {}
}
setInterval(() => { contadorTick(); }, 1000);
setInterval(buscaAndamento, 2000);
contadorTick();
setData(EMBED.csv);
agenda();
</script>
</body>
</html>
